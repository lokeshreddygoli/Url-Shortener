name: Shortly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Tests, Build & E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shortly
          POSTGRES_PASSWORD: shortly_dev_password
          POSTGRES_DB: shortly
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shortly -d shortly"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      APP_URL: http://127.0.0.1:3100
      NEXTAUTH_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://shortly:shortly_dev_password@127.0.0.1:5432/shortly?schema=public
      TEST_DATABASE_URL: postgresql://shortly:shortly_dev_password@127.0.0.1:5432/shortly_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long-0123456789
      ANALYTICS_HASH_SECRET: ci-analytics-secret-at-least-32-characters-long-012345
      GUEST_CLAIM_SECRET: ci-guest-claim-secret-at-least-32-characters-long-01234

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create test database & apply Prisma migrations
        run: |
          PGPASSWORD=shortly_dev_password psql -h 127.0.0.1 -U shortly -d shortly -c "CREATE DATABASE shortly_test;" || true
          npx prisma generate
          npx prisma migrate deploy
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & Integration Tests
        run: npm run test:coverage

      - name: Production Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test --project=chromium

      - name: Dependency Security Audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
